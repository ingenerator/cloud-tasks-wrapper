name: Run tests
on:
  push:
    branches:
      # Only mainline branches, features etc are covered on the pull_request trigger
      - '*.x'
  pull_request:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Run tests
    strategy:
      fail-fast: false
      matrix:
        php_version:
        - '8.4'
        - '8.5'
        - '8.6'
        dependency-versions:
        - 'lowest'
        - 'default'
    env:
      php_extensions: grpc, protobuf
      # ext-grpc threads outlive grpc_shutdown(), so PHP 8.5 on ubuntu-26.04
      # segfaults at exit when grpc.so is unloaded. Skip the unload until
      # https://github.com/grpc/grpc/issues/42242 is fixed.
      ZEND_DONT_UNLOAD_MODULES: 1

    steps:
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php_version }}
        tools: composer:v2
        extensions: ${{ env.php_extensions }}

    - name: Checkout
      uses: actions/checkout@v7
      with:
        show-progress: false

    - name: Install composer dependencies
      uses: ramsey/composer-install@v4
      with:
        dependency-versions: ${{ matrix.dependency-versions }}

    - name: Run unit tests
      run: |
        vendor/bin/phpunit --testsuite=unit

    - name: Run integration tests
      run: |
        vendor/bin/phpunit --testsuite=integration
